spring.application.name=protocols-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:induztek_protocols}?serverTimezone=UTC
spring.datasource.username=${DB_USER:protocols_app}
spring.datasource.password=${DB_PASSWORD:protocols-local-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
users.service.url=${USERS_SERVICE_URL:http://localhost:8082}
