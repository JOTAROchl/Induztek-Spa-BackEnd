spring.application.name=roles-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:induztek_roles}?serverTimezone=UTC
spring.datasource.username=${DB_USER:roles_app}
spring.datasource.password=${DB_PASSWORD:roles-local-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
