spring.application.name=users-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:induztek_users}?serverTimezone=UTC
spring.datasource.username=${DB_USER:users_app}
spring.datasource.password=${DB_PASSWORD:users-local-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
roles.service.url=${ROLES_SERVICE_URL:http://localhost:8081}
spring.jackson.default-property-inclusion=non_null
